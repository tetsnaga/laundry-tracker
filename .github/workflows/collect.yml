name: Collect laundry status

on:
  workflow_dispatch:
  schedule:
    # Explicit values avoid scheduler ambiguity around a ranged step expression.
    # Spread away from the top of the hour, when Actions schedules are busiest.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'

permissions:
  contents: write

concurrency:
  group: laundry-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.COLLECTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out collector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: app

      - name: Check out persistent history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: data
          path: history

      - name: Collect one snapshot
        id: collect
        env:
          WASH_EMAIL: ${{ secrets.WASH_EMAIL }}
          WASH_PASSWORD: ${{ secrets.WASH_PASSWORD }}
          WASH_ROOM_ID: ${{ vars.WASH_ROOM_ID }}
        run: python3 app/collect.py --data-dir history/data

      - name: Persist observations and poll failures
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        working-directory: history
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d data ]; then
            echo 'No poll data was produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record laundry poll ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in 1 2 3; do
            if git push origin HEAD:data; then
              exit 0
            fi
            git pull --rebase origin data
            sleep 2
          done
          echo 'Failed to persist poll data.'
          exit 1
